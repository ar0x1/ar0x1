<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="CHAT-BOT — conversational AI interface with custom character personas. Status: active. Link: github.com/ar0x1/CHAT-BOT">
  <title>CHAT-BOT — conversational AI</title>
  <defs>
    <linearGradient id="cb-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C15"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="cb-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="cb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cb-clip"><rect width="720" height="150" rx="16"/></clipPath>
  </defs>

  <rect width="720" height="150" rx="16" fill="url(#cb-surface)" stroke="#1C1C26"/>
  <g clip-path="url(#cb-clip)">
    <rect width="4" height="150" fill="url(#cb-bar)"/>
    <circle cx="640" cy="-20" r="150" fill="url(#cb-glow)"/>
    <path d="M30 118 H120 L146 92 H210" fill="none" stroke="#EC4899" stroke-opacity=".1" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- icon: chat bubble -->
  <rect x="30" y="35" width="48" height="48" rx="12" fill="#0D0D18" stroke="#262636"/>
  <rect x="42" y="48" width="24" height="16" rx="5" fill="none" stroke="#EC4899" stroke-width="1.5"/>
  <path d="M49 64 v5 l5 -5" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="56" r="1.4" fill="#EC4899"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="54" cy="56" r="1.4" fill="#EC4899"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
  <circle cx="59" cy="56" r="1.4" fill="#EC4899"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></circle>

  <!-- text block -->
  <text x="98" y="49" font-size="9.5" letter-spacing="2.5" fill="#EC4899">CONVERSATIONAL AI</text>
  <text x="98" y="76" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#F5F5F7">CHAT-BOT</text>
  <text x="98" y="100" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#A6A6B4">Conversational AI interface with custom character personas.</text>
  <text x="98" y="124" font-size="11" letter-spacing=".5" fill="#75757F">TypeScript · custom avatars · personas</text>

  <!-- right column -->
  <circle cx="626" cy="44" r="3" fill="#EC4899">
    <animate attributeName="opacity" values="1;.35;1" dur="2.6s" begin="-1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="690" y="48" text-anchor="end" font-size="10" letter-spacing="2" fill="#EC4899">ACTIVE</text>

  <rect x="594" y="84" width="96" height="32" rx="9" fill="#10101C" stroke="#2A2A3A"/>
  <text x="634" y="104" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#C9C9D2">GITHUB</text>
  <path d="M672 106 L680 98 M674 98 h6 v6" fill="none" stroke="#8B8B98" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="690" y="136" text-anchor="end" font-size="9" letter-spacing="1" fill="#33333E">03</text>
</svg>
