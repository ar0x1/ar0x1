<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="740" height="450" viewBox="0 0 740 450" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="ar0x — AI builder, indie developer, experimental systems">
  <title>ar0x — AI builder</title>
  <defs>
    <radialGradient id="h-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity=".26"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-coreIn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#7FA5FF" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B4B6C8"/>
    </linearGradient>
    <linearGradient id="h-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="h-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
    </pattern>
    <radialGradient id="h-fadeG" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <mask id="h-fade">
      <rect width="740" height="450" fill="url(#h-fadeG)"/>
    </mask>
    <clipPath id="h-clip">
      <rect x="1" y="1" width="738" height="448" rx="17"/>
    </clipPath>
  </defs>

  <!-- base -->
  <rect width="740" height="450" rx="18" fill="#050508" stroke="#1A1A24"/>
  <g clip-path="url(#h-clip)">
    <rect width="740" height="450" fill="url(#h-grid)" mask="url(#h-fade)"/>

    <!-- scanline -->
    <rect x="1" y="-60" width="738" height="54" fill="url(#h-scan)">
      <animate attributeName="y" values="-60;450" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#262636" stroke-width="1.5" stroke-linecap="round">
    <path d="M22 46 v-16 q0 -8 8 -8 h16"/>
    <path d="M694 22 h16 q8 0 8 8 v16"/>
    <path d="M718 404 v16 q0 8 -8 8 h-16"/>
    <path d="M46 428 h-16 q-8 0 -8 -8 v-16"/>
  </g>

  <!-- HUD labels -->
  <circle cx="30" cy="27" r="2.5" fill="#4F8CFF">
    <animate attributeName="opacity" values="1;.35;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="31" font-size="9.5" letter-spacing="3" fill="#565664">SYS // AR0X</text>
  <text x="710" y="31" text-anchor="end" font-size="9.5" letter-spacing="3" fill="#565664">GITHUB.COM/AR0X1</text>

  <!-- identity -->
  <text x="379" y="128" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="18" fill="url(#h-title)">ar0x</text>
  <rect x="322" y="146" width="96" height="2" rx="1" fill="url(#h-acc)" opacity=".85"/>
  <text x="374" y="176" text-anchor="middle" font-size="11.5" letter-spacing="3.5" fill="#8B8B98">AI BUILDER · INDIE DEVELOPER · EXPERIMENTAL SYSTEMS</text>

  <!-- orbital core -->
  <circle cx="370" cy="282" r="120" fill="url(#h-glow)" opacity=".5"/>

  <g fill="none" stroke="url(#h-acc)">
    <ellipse cx="370" cy="282" rx="240" ry="78" transform="rotate(-13 370 282)" stroke-opacity=".35" stroke-width="1" stroke-dasharray="1 6">
      <animate attributeName="stroke-dashoffset" values="0;-56" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="370" cy="282" rx="185" ry="58" transform="rotate(10 370 282)" stroke-opacity=".28" stroke-width="1" stroke-dasharray="1 5">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <ellipse cx="370" cy="282" rx="118" ry="36" transform="rotate(-7 370 282)" fill="none" stroke="#303044" stroke-opacity=".55" stroke-width="1"/>

  <!-- orbiting particles -->
  <g transform="rotate(-13 370 282)">
    <path id="h-pA" d="M130 282 a240 78 0 1 0 480 0 a240 78 0 1 0 -480 0" fill="none"/>
    <circle r="2.3" fill="#4F8CFF">
      <animateMotion dur="24s" repeatCount="indefinite"><mpath xlink:href="#h-pA" href="#h-pA"/></animateMotion>
    </circle>
    <circle r="1.7" fill="#8B5CF6" opacity=".85">
      <animateMotion dur="24s" begin="-12s" repeatCount="indefinite"><mpath xlink:href="#h-pA" href="#h-pA"/></animateMotion>
    </circle>
  </g>
  <g transform="rotate(10 370 282)">
    <path id="h-pB" d="M185 282 a185 58 0 1 0 370 0 a185 58 0 1 0 -370 0" fill="none"/>
    <circle r="1.9" fill="#EC4899">
      <animateMotion dur="17s" repeatCount="indefinite"><mpath xlink:href="#h-pB" href="#h-pB"/></animateMotion>
    </circle>
    <circle r="1.4" fill="#C9C9D2" opacity=".8">
      <animateMotion dur="17s" begin="-8.5s" repeatCount="indefinite"><mpath xlink:href="#h-pB" href="#h-pB"/></animateMotion>
    </circle>
  </g>
  <g transform="rotate(-7 370 282)">
    <path id="h-pC" d="M252 282 a118 36 0 1 0 236 0 a118 36 0 1 0 -236 0" fill="none"/>
    <circle r="1.6" fill="#4F8CFF" opacity=".8">
      <animateMotion dur="12s" repeatCount="indefinite"><mpath xlink:href="#h-pC" href="#h-pC"/></animateMotion>
    </circle>
  </g>

  <!-- core -->
  <circle cx="370" cy="282" r="38" fill="#0B0B15" stroke="url(#h-acc)" stroke-width="1.2"/>
  <path d="M395 282 L382.5 303.65 L357.5 303.65 L345 282 L357.5 260.35 L382.5 260.35 Z" fill="#0D0D1C" stroke="#8B5CF6" stroke-opacity=".65" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="0 370 282" to="360 370 282" dur="46s" repeatCount="indefinite"/>
  </path>
  <circle cx="370" cy="282" r="20" fill="url(#h-coreIn)">
    <animate attributeName="r" values="19;23;19" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="282" r="2.8" fill="#FFFFFF" opacity=".95"/>

  <!-- twinkles -->
  <g>
    <circle cx="150" cy="238" r="1.2" fill="#4F8CFF"><animate attributeName="opacity" values=".15;.6;.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="230" r="1.4" fill="#8B5CF6"><animate attributeName="opacity" values=".1;.55;.1" dur="5.6s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="360" r="1.3" fill="#EC4899"><animate attributeName="opacity" values=".15;.5;.15" dur="3.8s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="300" r="1.2" fill="#8B8B98"><animate attributeName="opacity" values=".1;.45;.1" dur="6.4s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="315" r="1.1" fill="#4F8CFF"><animate attributeName="opacity" values=".12;.5;.12" dur="4.9s" begin="-1.6s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="205" r="1" fill="#8B5CF6"><animate attributeName="opacity" values=".1;.5;.1" dur="7.2s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="205" r="1.1" fill="#8B8B98"><animate attributeName="opacity" values=".1;.4;.1" dur="5.1s" begin="-2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="352" r="1" fill="#4F8CFF"><animate attributeName="opacity" values=".1;.45;.1" dur="6.1s" begin="-5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- circuit paths -->
  <g fill="none" stroke-width="1">
    <path d="M60 384 H140 L172 352 H238" stroke="#4F8CFF" stroke-opacity=".16" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M680 384 H600 L568 352 H502" stroke="#EC4899" stroke-opacity=".16" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M60 208 H128 L156 236 H206" stroke="#8B5CF6" stroke-opacity=".15" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="6.5s" begin="-2s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="238" cy="352" r="2" fill="#4F8CFF" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="502" cy="352" r="2" fill="#EC4899" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="3.6s" begin="-1s" repeatCount="indefinite"/></circle>
  <circle cx="206" cy="236" r="2" fill="#8B5CF6" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="4.2s" begin="-2s" repeatCount="indefinite"/></circle>

  <!-- project chips -->
  <g font-size="10.5" letter-spacing="2" fill="#D6D6E2">
    <rect x="266" y="390" width="84" height="28" rx="14" fill="#0B0B15" stroke="#262636"/>
    <circle cx="282" cy="404" r="2.8" fill="#4F8CFF"><animate attributeName="opacity" values="1;.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="313" y="408" text-anchor="middle">AURA</text>
    <rect x="362" y="390" width="112" height="28" rx="14" fill="#0B0B15" stroke="#262636"/>
    <circle cx="378" cy="404" r="2.8" fill="#EC4899"><animate attributeName="opacity" values="1;.4;1" dur="3.4s" begin="-1s" repeatCount="indefinite"/></circle>
    <text x="423" y="408" text-anchor="middle">CHAT-BOT</text>
  </g>

  <!-- explore -->
  <text x="366" y="440" text-anchor="middle" font-size="10" letter-spacing="2.5" fill="#67677A">explore the work</text>
  <path d="M0 0 l4.5 4.5 L9 0" transform="translate(448 434)" fill="none" stroke="#8B5CF6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="448 434; 448 438; 448 434" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
