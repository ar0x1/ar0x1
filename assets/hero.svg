<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">ar0x — AI, code and experiments</title>
<desc id="desc">Animated futuristic developer profile banner for ar0x.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset=".5" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="bg">
    <stop offset="0" stop-color="#15112b"/>
    <stop offset="1" stop-color="#050507"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<rect width="1200" height="430" rx="28" fill="url(#grid)"/>

<g opacity=".35" filter="url(#glow)">
  <circle cx="100" cy="80" r="95" fill="#8b5cf6"/>
  <circle cx="1090" cy="350" r="120" fill="#06b6d4"/>
</g>

<g fill="none" stroke="url(#g)" stroke-opacity=".35">
  <path d="M40 335 C250 210 390 390 610 250 S950 80 1160 170"/>
  <path d="M0 380 C220 260 380 410 590 300 S940 140 1200 220"/>
</g>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="92" y="125" fill="#a7f3d0" font-size="18" letter-spacing="5" opacity=".9">AR0X / DEVELOPER PROFILE</text>
  <text x="88" y="210" fill="#fff" font-size="76" font-weight="800" letter-spacing="-3">HELLO, I'M AR0X</text>
  <text x="92" y="255" fill="#cbd5e1" font-size="25">AI • CODE • AUTOMATION • EXPERIMENTS</text>
  <text x="92" y="310" fill="url(#g)" font-size="22" font-weight="700">building things, breaking things, learning faster.</text>
  <text x="92" y="365" fill="#64748b" font-size="16" letter-spacing="2">STATUS: BUILDING AURA + AI EXPERIENCES</text>
</g>

<g transform="translate(1015 76)">
  <rect width="105" height="105" rx="22" fill="#0b0b12" stroke="url(#g)" stroke-width="2"/>
  <text x="52.5" y="58" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">A</text>
  <circle cx="82" cy="82" r="7" fill="#22c55e">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</g>

<rect x="92" y="382" width="1016" height="2" fill="url(#g)" opacity=".55">
  <animate attributeName="opacity" values=".25;.8;.25" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>