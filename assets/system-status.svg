<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="System status: AURA active, AURA-lang building, CHAT-BOT active, experiments always. Status: building.">
  <title>System status</title>
  <defs>
    <linearGradient id="sy-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C15"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="sy-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="720" height="232" rx="16" fill="url(#sy-surface)" stroke="#1C1C26"/>

  <!-- header -->
  <text x="28" y="25" font-size="10" letter-spacing="4" fill="#8B8B98">SYSTEM // STATUS</text>
  <circle cx="699" cy="21" r="2.6" fill="#4F8CFF">
    <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="692" y="25" text-anchor="end" font-size="9.5" letter-spacing="3" fill="#565664">LIVE</text>
  <line x1="0" y1="40" x2="720" y2="40" stroke="#16161F"/>

  <!-- rows -->
  <g font-size="13" fill="#DEDEE8">
    <text x="28" y="74">AURA</text>
    <text x="28" y="108">AURA-lang</text>
    <text x="28" y="142">CHAT-BOT</text>
    <text x="28" y="176">EXPERIMENTS</text>
  </g>

  <g stroke="#191924" stroke-dasharray="2 6">
    <line x1="130" y1="70" x2="600" y2="70"/>
    <line x1="130" y1="104" x2="600" y2="104"/>
    <line x1="130" y1="138" x2="600" y2="138"/>
    <line x1="130" y1="172" x2="600" y2="172"/>
  </g>

  <!-- travelling packets -->
  <circle r="2" fill="#4F8CFF" opacity=".55">
    <animateMotion path="M130 70 L600 70" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.55;.55;0" keyTimes="0;.1;.85;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#EC4899" opacity=".55">
    <animateMotion path="M130 138 L600 138" dur="7s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.55;.55;0" keyTimes="0;.1;.85;1" dur="7s" begin="-3s" repeatCount="indefinite"/>
  </circle>

  <!-- values -->
  <circle cx="629" cy="66" r="3" fill="#4F8CFF"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="692" y="70" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#4F8CFF">ACTIVE</text>

  <circle cx="611" cy="100" r="3" fill="#8B5CF6"><animate attributeName="opacity" values="1;.35;1" dur="2s" begin="-.5s" repeatCount="indefinite"/></circle>
  <text x="692" y="104" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#8B5CF6">BUILDING</text>

  <circle cx="629" cy="134" r="3" fill="#EC4899"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" begin="-1s" repeatCount="indefinite"/></circle>
  <text x="692" y="138" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#EC4899">ACTIVE</text>

  <circle cx="629" cy="168" r="3" fill="url(#sy-acc)"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="692" y="172" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#C9C9D2">ALWAYS</text>

  <g stroke="#13131C">
    <line x1="28" y1="87" x2="692" y2="87"/>
    <line x1="28" y1="121" x2="692" y2="121"/>
    <line x1="28" y1="155" x2="692" y2="155"/>
  </g>

  <!-- footer -->
  <line x1="0" y1="196" x2="720" y2="196" stroke="#16161F"/>
  <text x="28" y="220" font-size="10.5" letter-spacing="2" fill="#565664">STATUS:</text>
  <text x="100" y="220" font-size="10.5" letter-spacing="2" fill="#DEDEE8">BUILDING</text>
  <rect x="170" y="210" width="7" height="13" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="692" y="220" text-anchor="end" font-size="9.5" letter-spacing="3" fill="#33333E">AR0X.SYS</text>
</svg>
