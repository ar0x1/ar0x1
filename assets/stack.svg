<svg xmlns="http://www.w3.org/2000/svg" width="720" height="112" viewBox="0 0 720 112" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Stack: TypeScript, Next.js, Tailwind CSS, Prisma, Python, AI and LLM APIs, Vite, Git and GitHub">
