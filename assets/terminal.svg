<svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Identity terminal — ar0x. Commands: whoami returns ar0x. focus returns AI systems, experimental interfaces, curiosity-driven software. shipping returns AURA, AR-img, CHAT-BOT. status returns building always. motto returns build break learn repeat.">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0C1A"/>
      <stop offset="50%" stop-color="#080912"/>
      <stop offset="100%" stop-color="#06070F"/>
    </linearGradient>
    <linearGradient id="tBd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4F8CFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tScr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04050B"/>
      <stop offset="100%" stop-color="#06070F"/>
    </linearGradient>
    <radialGradient id="tAmb" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .u  { font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace; }
      .p  { fill:#22D3EE; font-size:14px; letter-spacing:0.4px; }
      .c  { fill:#E8E8F0; font-size:14px; letter-spacing:0.2px; }
      .o  { fill:#B8B8C8; font-size:14px; letter-spacing:0.2px; }
      .hL { fill:#E8E8F0; font-size:12px; letter-spacing:1.8px; }
      .hS { fill:#6B6B7B; font-size:11px; letter-spacing:1.6px; }
      @media (prefers-reduced-motion:reduce){ animate { display:none } }
    </style>
  </defs>

  <!-- outer panel -->
  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#tBg)"/>
  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#tAmb)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="url(#tBd)" stroke-width="1"/>

  <!-- title bar -->
  <rect x="20" y="20" width="1160" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.02" stroke="#8B9CFF" stroke-opacity="0.14" stroke-width="1"/>
  <g>
    <circle cx="48" cy="42" r="5" fill="#FF5F56" opacity="0.85"/>
    <circle cx="68" cy="42" r="5" fill="#FFBD2E" opacity="0.85"/>
    <circle cx="88" cy="42" r="5" fill="#27C93F" opacity="0.85"/>
  </g>
  <text x="600" y="46" class="u hL" text-anchor="middle">ar0x@local · ~/identity</text>
  <text x="1156" y="46" class="u hS" text-anchor="end">// GLASS-OS · v0.1</text>

  <!-- screen -->
  <rect x="20" y="76" width="1160" height="224" rx="14" fill="url(#tScr)"/>
  <rect x="20.5" y="76.5" width="1159" height="223" rx="14" fill="none" stroke="#8B9CFF" stroke-opacity="0.12" stroke-width="1"/>
  <!-- screen top inner highlight -->
  <path d="M 36 78 H 1164" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.6"/>

  <!-- subtle scan line drifting -->
  <rect x="20" y="100" width="1160" height="1" fill="#22D3EE" opacity="0.08">
    <animate attributeName="y" values="100;280;100" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.04;0.1;0.04" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal lines -->
  <g class="u">
    <text x="44" y="110"><tspan class="p">$ whoami</tspan><tspan class="o" dx="14">→</tspan><tspan class="c" dx="14">ar0x</tspan></text>
    <text x="44" y="142"><tspan class="p">$ focus</tspan><tspan class="o" dx="14">→</tspan><tspan class="c" dx="14">AI systems · experimental interfaces · curiosity-driven software</tspan></text>
    <text x="44" y="174"><tspan class="p">$ shipping</tspan><tspan class="o" dx="14">→</tspan><tspan class="c" dx="14">AURA · AR-img · CHAT-BOT</tspan></text>
    <text x="44" y="206"><tspan class="p">$ status</tspan><tspan class="o" dx="14">→</tspan><tspan class="c" dx="14">building · always</tspan></text>
    <text x="44" y="238"><tspan class="p">$ motto</tspan><tspan class="o" dx="14">→</tspan><tspan class="c" dx="14">build → break → learn → repeat</tspan></text>
    <text x="44" y="270"><tspan class="p">$ </tspan></text>
    <!-- blinking cursor -->
    <rect x="64" y="258" width="9" height="16" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
