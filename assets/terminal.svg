<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Terminal. Command whoami returns ar0x. Command focus returns AI systems, experimental software, creative tools. Command status returns building.">
  <title>Terminal</title>
  <defs>
    <linearGradient id="tm-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C15"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="tm-acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="tm-clip"><rect width="720" height="250" rx="16"/></clipPath>
  </defs>

  <rect width="720" height="250" rx="16" fill="url(#tm-surface)" stroke="#1C1C26"/>
  <g clip-path="url(#tm-clip)">
    <rect x="0" y="0" width="720" height="40" fill="#0D0D16"/>
    <rect x="0" y="0" width="3" height="250" fill="url(#tm-acc)" opacity=".8"/>
  </g>

  <!-- window chrome -->
  <circle cx="28" cy="20" r="4.2" fill="#262633"/>
  <circle cx="46" cy="20" r="4.2" fill="#2C2C3A"/>
  <circle cx="64" cy="20" r="4.2" fill="#343444"/>
  <text x="360" y="24" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#5E5E6C">ar0x@github: ~</text>
  <line x1="0" y1="40" x2="720" y2="40" stroke="#16161F"/>

  <!-- session -->
  <g font-size="12.5">
    <text x="28" y="78" fill="#4F8CFF">$</text>
    <text x="44" y="78" fill="#E2E2EC">whoami</text>
    <text x="28" y="102" fill="#F5F5F7" font-weight="700">ar0x</text>

    <text x="28" y="134" fill="#4F8CFF">$</text>
    <text x="44" y="134" fill="#E2E2EC">focus</text>
    <text x="28" y="158" fill="#9C9CA8">ai systems · experimental software · creative tools</text>

    <text x="28" y="190" fill="#4F8CFF">$</text>
    <text x="44" y="190" fill="#E2E2EC">status</text>
    <text x="28" y="214" fill="#F5F5F7" font-weight="700">building</text>
  </g>
  <rect x="96" y="203" width="7" height="14" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
