<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="AURA — personal AI ecosystem. Status: active. Private build.">
  <title>AURA — personal AI ecosystem</title>
  <defs>
    <linearGradient id="ca-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C15"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="ca-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="ca-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ca-clip"><rect width="720" height="150" rx="16"/></clipPath>
  </defs>

  <rect width="720" height="150" rx="16" fill="url(#ca-surface)" stroke="#1C1C26"/>
  <g clip-path="url(#ca-clip)">
    <rect width="4" height="150" fill="url(#ca-bar)"/>
    <circle cx="640" cy="-20" r="150" fill="url(#ca-glow)"/>
    <path d="M30 118 H120 L146 92 H210" fill="none" stroke="#4F8CFF" stroke-opacity=".1" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- icon: hex core -->
  <rect x="30" y="35" width="48" height="48" rx="12" fill="#0D0D18" stroke="#262636"/>
  <path d="M66 59 L60 69.35 L48 69.35 L42 59 L48 48.65 L60 48.65 Z" fill="none" stroke="#4F8CFF" stroke-width="1.5" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="rotate" from="0 54 59" to="360 54 59" dur="30s" repeatCount="indefinite"/>
  </path>
  <circle cx="54" cy="59" r="2.5" fill="#4F8CFF">
    <animate attributeName="opacity" values="1;.45;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- text block -->
  <text x="98" y="49" font-size="9.5" letter-spacing="2.5" fill="#4F8CFF">PERSONAL AI ECOSYSTEM</text>
  <text x="98" y="76" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#F5F5F7">AURA</text>
  <text x="98" y="100" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#A6A6B4">AI ecosystem for intelligent interaction and experimentation.</text>
  <text x="98" y="124" font-size="11" letter-spacing=".5" fill="#75757F">TypeScript · AI / LLM APIs</text>

  <!-- right column -->
  <circle cx="626" cy="44" r="3" fill="#4F8CFF">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="690" y="48" text-anchor="end" font-size="10" letter-spacing="2" fill="#4F8CFF">ACTIVE</text>

  <rect x="568" y="84" width="122" height="32" rx="9" fill="#0E0E18" stroke="#232330" stroke-dasharray="3 3"/>
  <text x="629" y="104" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="#6E6E7E">PRIVATE BUILD</text>

  <text x="690" y="136" text-anchor="end" font-size="9" letter-spacing="1" fill="#33333E">01</text>
</svg>
