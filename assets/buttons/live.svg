<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 44" width="152" height="44" role="img" aria-label="Live site — visit the live AURA deployment.">
  <defs>
    <linearGradient id="gBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1020"/>
      <stop offset="100%" stop-color="#070811"/>
    </linearGradient>
    <linearGradient id="gBd2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="gPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .u { font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace; }
      .l { fill:#E8E8F0; font-size:11.5px; letter-spacing:2.6px; }
      @media (prefers-reduced-motion:reduce){ animate { display:none } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="151" height="43" rx="21.5" fill="url(#gBg2)" stroke="url(#gBd2)" stroke-width="1"/>
  <path d="M 14 22 H 138" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.6"/>
  <path d="M 14.5 1.5 H 137.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.6"/>
  <!-- live pulse icon -->
  <g transform="translate(30 22)">
    <circle r="10" fill="url(#gPulse)">
      <animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="none" stroke="#F472B6" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle r="2.4" fill="#FCE7F3"/>
  </g>
  <text x="48" y="27" class="u l">LIVE</text>
</svg>
