<svg xmlns="http://www.w3.org/2000/svg" width="720" height="196" viewBox="0 0 720 196" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Activity stream: building AURA, experimenting with AI interfaces, improving AURA-lang, shipping small experiments, learning something new.">
  <title>Activity stream</title>
  <defs>
    <linearGradient id="ac-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C15"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <radialGradient id="ac-tint" cx="85%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="196" rx="16" fill="url(#ac-surface)" stroke="#1C1C26"/>
  <rect width="720" height="196" rx="16" fill="url(#ac-tint)"/>

  <!-- header -->
  <text x="28" y="25" font-size="10" letter-spacing="4" fill="#8B8B98">// ACTIVITY</text>
  <text x="692" y="25" text-anchor="end" font-size="9.5" letter-spacing="3" fill="#565664">STREAM</text>
  <line x1="0" y1="40" x2="720" y2="40" stroke="#16161F"/>

  <!-- stream lines -->
  <g font-size="12.5">
    <text x="28" y="68" fill="#4F8CFF">&#9656;</text>
    <text x="44" y="68" fill="#C9C9D2">building AURA</text>

    <text x="28" y="94" fill="#8B5CF6">&#9656;</text>
    <text x="44" y="94" fill="#93939F">experimenting with AI interfaces</text>

    <text x="28" y="120" fill="#EC4899">&#9656;</text>
    <text x="44" y="120" fill="#C9C9D2">improving AURA-lang</text>

    <text x="28" y="146" fill="#4F8CFF">&#9656;</text>
    <text x="44" y="146" fill="#93939F">shipping small experiments</text>

    <text x="28" y="172" fill="#8B5CF6">&#9656;</text>
    <text x="44" y="172" fill="#C9C9D2">learning something new</text>
  </g>

  <!-- cursor -->
  <rect x="224" y="160" width="7" height="14" fill="#EC4899">
    <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
