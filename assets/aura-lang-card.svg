<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" font-family="'JetBrains Mono','SFMono-Regular',SFMono,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="AURA-lang — early-stage TypeScript core of the AURA ecosystem. Status: building. Link: github.com/ar0x1/AURA-lang">
  <title>AURA-lang — ecosystem language layer</title>
  <defs>
    <linearGradient id="cl-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0C15"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="cl-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="cl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cl-clip"><rect width="720" height="150" rx="16"/></clipPath>
  </defs>

  <rect width="720" height="150" rx="16" fill="url(#cl-surface)" stroke="#1C1C26"/>
  <g clip-path="url(#cl-clip)">
    <rect width="4" height="150" fill="url(#cl-bar)"/>
    <circle cx="640" cy="-20" r="150" fill="url(#cl-glow)"/>
    <path d="M30 118 H120 L146 92 H210" fill="none" stroke="#8B5CF6" stroke-opacity=".1" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- icon: code chevrons -->
  <rect x="30" y="35" width="48" height="48" rx="12" fill="#0D0D18" stroke="#262636"/>
  <g fill="none" stroke="#8B5CF6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 51 l-8 8 8 8"/>
    <path d="M58 51 l8 8 -8 8"/>
  </g>

  <!-- text block -->
  <text x="98" y="49" font-size="9.5" letter-spacing="2.5" fill="#8B5CF6">ECOSYSTEM / LANGUAGE LAYER</text>
  <text x="98" y="76" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#F5F5F7">AURA-lang</text>
  <text x="98" y="100" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#A6A6B4">Early-stage TypeScript core of the AURA ecosystem.</text>
  <text x="98" y="124" font-size="11" letter-spacing=".5" fill="#75757F">TypeScript · Next.js · Prisma · WebSocket</text>

  <!-- right column -->
  <circle cx="610" cy="44" r="3" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;.35;1" dur="2.1s" begin="-.6s" repeatCount="indefinite"/>
  </circle>
  <text x="690" y="48" text-anchor="end" font-size="10" letter-spacing="2" fill="#8B5CF6">BUILDING</text>

  <rect x="594" y="84" width="96" height="32" rx="9" fill="#10101C" stroke="#2A2A3A"/>
  <text x="634" y="104" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#C9C9D2">GITHUB</text>
  <path d="M672 106 L680 98 M674 98 h6 v6" fill="none" stroke="#8B8B98" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="690" y="136" text-anchor="end" font-size="9" letter-spacing="1" fill="#33333E">02</text>
</svg>
