<svg viewBox="0 0 820 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animation: whoami returns ar0x1, focus is AURA, live status online">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a16"/>
      <stop offset="100%" stop-color="#050509"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card { fill: url(#panel); stroke: url(#accent); stroke-width: 1.4; }
    .term {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 16px;
    }
    .prompt { fill: #a855f7; }
    .out { fill: #7dd3fc; }
    .dim { fill: #5b6472; font-size: 12px; }
    .dot { }
    .status { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

    .line { clip-path: inset(0 100% 0 0); animation-timing-function: steps(22, end); animation-fill-mode: forwards; }
    .l1 { animation: reveal .5s forwards; animation-delay: .2s; }
    .l2 { animation: reveal .4s forwards; animation-delay: .8s; }
    .l3 { animation: reveal .6s forwards; animation-delay: 1.4s; }
    .l4 { animation: reveal 1.3s forwards; animation-delay: 2.1s; }
    .l5 { animation: reveal .7s forwards; animation-delay: 3.5s; }
    .l6 { animation: reveal .8s forwards; animation-delay: 4.3s; }
    @keyframes reveal { to { clip-path: inset(0 0% 0 0); } }

    .cursor { opacity: 0; animation: cursorIn .1s ease-in forwards, blink 1s steps(1) infinite; animation-delay: 5.2s, 5.3s; }
    @keyframes cursorIn { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .line { clip-path: inset(0 0% 0 0); animation: none; }
      .cursor { opacity: 1; animation: none; }
      .status { animation: none; opacity: .9; }
    }
  </style>

  <rect x="6" y="6" width="808" height="288" rx="18" class="card" filter="url(#cardGlow)"/>

  <!-- title bar -->
  <circle class="dot" cx="34" cy="30" r="6" fill="#5b3a3a"/>
  <circle class="dot" cx="54" cy="30" r="6" fill="#5b5230"/>
  <circle class="dot" cx="74" cy="30" r="6" fill="#345b3a"/>
  <text x="784" y="34" text-anchor="end" class="term dim">ar0x1@github</text>
  <line x1="6" y1="52" x2="814" y2="52" stroke="#1c1f2b" stroke-width="1"/>
  <circle cx="762" cy="30" r="4" fill="#34d399" class="status"/>

  <!-- terminal content -->
  <g class="term">
    <g class="line l1"><text x="34" y="96" class="prompt">$ whoami</text></g>
    <g class="line l2"><text x="54" y="130" class="out">ar0x1</text></g>

    <g class="line l3"><text x="34" y="164" class="prompt">$ cat focus</text></g>
    <g class="line l4"><text x="54" y="198" class="out">indie builder · AI experiments · solo-shipped</text></g>

    <g class="line l5"><text x="34" y="232" class="prompt">$ ping AURA --live</text></g>
    <g class="line l6"><text x="54" y="266" class="out">online → amaura.run.app</text></g>
  </g>

  <rect class="cursor" x="256" y="253" width="10" height="18" fill="#a855f7"/>
</svg>
